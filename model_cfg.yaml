DATA:
  root_dir: /geogfs1/groups/hkurs/u3666068mgh/Tallin
  train_split: train
  val_split: val
  test_split: test
  subset_count: 4096
  NPOINT: 4096
  batch_size: 64
  num_workers: 16
  normalize_with_full_cloud: true
  use_building3d_format: false
  use_color: false
  use_intensity: false

OPTIM:
  epochs: 150
  lr: 0.002
  weight_decay: 0.001
  lr_step: 25
  lr_gamma: 0.5

MODEL:
  use_edge: false
  edge_start_epoch: 1
  PointNet2:
    PosRadius: 0.15
    LossWeight:
      cls_weight: 1.0
      reg_weight: 1.0
  ClusterRefineNet:
    ScoreThresh: 0.3
    MatchRadius: 0.2
    num_keypoints: 16
    # DBSCAN 聚类参数（FPS 已废弃，恢复为 DBSCAN）
    # eps: 归一化空间中的邻域半径（0.03-0.05，越小角点分离越精细）
    # min_pts: 形成簇的最小点数（2-5，屋顶角点多时降低）
    Cluster:
      eps: 0.05
      min_pts: 2
    RefineSA:
      Radii: [0.1, 0.2]
      Nsamples: [16, 16]
      MLPs: [[128, 128], [128, 128]]
    LossWeight:
      reg_weight: 1.0
  EdgeAttentionNet:
    LossWeight:
      cls_weight: 1.0
    # edge_pos_weight 和 edge_neg_ratio 已废弃：Focal Loss 替代 BCE+负采样
